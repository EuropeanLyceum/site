user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Rate limiting zones (stricter for production)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=strict:10m rate=1r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    upstream frontend {
        server frontend:3000;
    }

    upstream admin-panel {
        server admin-panel:3001;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name european-lyceum.pp.ua site.european-lyceum.pp.ua;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name site.european-lyceum.pp.ua;

        ssl_certificate     /etc/ssl/cloudflare/origin.pem;
        ssl_certificate_key /etc/ssl/cloudflare/origin.key;

        # Connection limiting
        limit_conn conn_limit 20;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Content Security Policy - relaxed for Next.js but still secure
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: blob:; font-src 'self' data: http: https:; connect-src 'self' http: https: ws: wss: https://static.cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

        # Block common attack paths
        location ~ ^/(\.env|\.git|\.svn|\.htaccess|\.htpasswd|wp-admin|wp-login|phpmyadmin|adminer|\.well-known|\.DS_Store|Thumbs\.db) {
            return 404;
            access_log off;
        }

        # Block CGI-BIN and other common exploit paths
        location ~ ^/(cgi-bin|\.\.|\.\./|\.\.%2F|\.\.%5C) {
            return 404;
            access_log off;
        }

        # Block suspicious user agents
        if ($http_user_agent ~* (python-requests|ProxyPool|Keydrop|scanner|bot|crawler|spider)) {
            return 403;
        }

        # Serve uploaded files directly
        location /uploads {
            alias /usr/share/nginx/html/uploads;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Serve media files from Next.js (fonts, images, etc.)
        location /media/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Next.js static files - serve with long cache
        location /_next/static {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Next.js image optimization
        location /_next/image {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Admin panel root-level static assets (media, chunks, css)
        # Browser requests from root, but with basePath they're at /admin/* in container
        # Add /admin prefix when proxying to admin-panel
        location ~ ^/(media|chunks|css)/ {
            proxy_pass http://admin-panel/admin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Admin panel root-level JS files (webpack, main-app, layout, page, numbered chunks)
        # Browser requests from root, but with basePath they're at /admin/* in container
        # Add /admin prefix when proxying to admin-panel
        location ~ ^/(webpack-|main-app-|layout-|page-|[0-9]+-)[a-f0-9-]+\.js$ {
            proxy_pass http://admin-panel/admin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Admin panel Next.js static assets (_next/static, _next/image)
        # With basePath: '/admin', Next.js expects full path including basePath
        location ^~ /admin/_next/ {
            proxy_pass http://admin-panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Admin panel chunks, css, media static assets (if any at root level)
        # With basePath, most assets are under /_next/, but handle root-level if needed
        location ~ ^/admin/(chunks|css|media) {
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass http://admin-panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Admin panel public folder
        location ^~ /admin/public/ {
            alias /app/.next/standalone/public/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Admin panel API routes (with basePath, routes are at /admin/api/*)
        location ^~ /admin/api/ {
            # Rate limiting for API
            limit_req zone=api burst=10 nodelay;

            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Max-Age' 3600 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            # With basePath, preserve /admin prefix when proxying
            proxy_pass http://admin-panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Length $http_content_length;

            # Ensure request body is forwarded
            proxy_request_buffering off;
            client_body_buffer_size 128k;
            client_max_body_size 10m;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;

            # CORS headers for API responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # NextAuth defaults to /api/auth/* even when the app is mounted under /admin.
        # Proxy those requests to the admin panel's basePath routes.
        location ^~ /api/auth/ {
            rewrite ^/api/auth/(.*)$ /admin/api/auth/$1 break;
            proxy_pass http://admin-panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        # Admin panel routes - preserve /admin prefix when proxying (basePath requires it)
        # /admin/login -> /admin/login in the container, /admin/dashboard -> /admin/dashboard, etc.
        location ^~ /admin/ {
            proxy_pass http://admin-panel;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        # Admin panel root redirect
        location = /admin {
            return 301 /admin/;
        }

        # Catch /api/* requests and forward to /admin/api/* (for components using /api/* without basePath)
        # This must come before the frontend routes but after /admin/api/ to avoid conflicts
        # Handle both with and without trailing slashes to avoid 308 redirects
        location ~ ^/api/(.*?)/?$ {
            # Rate limiting for API
            limit_req zone=api burst=10 nodelay;

            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header 'Access-Control-Max-Age' 3600 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }

            # Rewrite /api/* to /admin/api/* (strip trailing slash if present) and proxy to admin-panel
            rewrite ^/api/(.*?)/?$ /admin/api/$1 break;
            proxy_pass http://admin-panel;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Content-Length $http_content_length;

            # Ensure request body is forwarded
            proxy_request_buffering off;
            client_body_buffer_size 128k;
            client_max_body_size 10m;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;

            # CORS headers for API responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        }

        # Frontend routes (default) - must be last
        location / {
            limit_req zone=general burst=10 nodelay;

            # Block POST requests to root (common attack pattern)
            # Legitimate POST requests should go to /api endpoints
            if ($request_method = POST) {
                return 405;
            }

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;

            # Timeout settings
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;

            # Buffering settings for better performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

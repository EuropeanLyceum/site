name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # Allow manual triggering

env:
  NODE_VERSION: '20'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      admin-image: ${{ steps.meta-admin.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Log in to Docker Hub (optional)
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #   continue-on-error: true

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: site-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for admin-panel
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: site-admin-panel
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: site-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build admin-panel image
        uses: docker/build-push-action@v5
        with:
          context: ./admin_panel
          file: ./admin_panel/Dockerfile
          push: false
          tags: site-admin-panel:latest
          build-args: |
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Save Docker images
        run: |
          docker save site-frontend:latest -o frontend-image.tar
          docker save site-admin-panel:latest -o admin-image.tar

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar
          retention-days: 1

      - name: Upload admin-panel image artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-image
          path: admin-image.tar
          retention-days: 1

  test:
    name: Run Tests and Linting
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            admin_panel/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install admin-panel dependencies
        working-directory: ./admin_panel
        run: npm ci

      - name: Run frontend linting
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: false

      - name: Run admin-panel linting
        working-directory: ./admin_panel
        run: npm run lint
        continue-on-error: false

      - name: Run frontend tests (if available)
        working-directory: ./frontend
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found, skipping tests"
          fi
        continue-on-error: true

      - name: Run admin-panel tests (if available)
        working-directory: ./admin_panel
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found, skipping tests"
          fi
        continue-on-error: true

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: http://localhost
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download frontend image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: .

      - name: Download admin-panel image artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-image
          path: .

      - name: Load Docker images
        run: |
          docker load -i frontend-image.tar
          docker load -i admin-image.tar

      - name: Create .env file for staging
        run: |
          cat > .env << EOF
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Deploy to staging
        run: |
          docker compose -f docker-compose.yml down || true
          docker compose -f docker-compose.yml build --no-cache
          docker compose -f docker-compose.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 15

      - name: Check container status
        run: |
          docker compose -f docker-compose.yml ps

      - name: Health check
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f -s http://localhost/health > /dev/null 2>&1; then
              echo "✓ Health endpoint responded successfully"
              exit 0
            fi
            echo "Waiting for health endpoint... ($attempt/$max_attempts)"
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "✗ Health check failed: endpoint did not respond within $((max_attempts * 2)) seconds"
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Verify all containers are running
        run: |
          failed=0
          for container in postgres_db admin-panel frontend nginx; do
            if docker ps --format '{{.Names}}' | grep -q "^${container}$"; then
              status=$(docker inspect --format='{{.State.Status}}' ${container} 2>/dev/null || echo "not found")
              if [ "$status" = "running" ]; then
                echo "✓ Container ${container} is running"
              else
                echo "✗ Container ${container} is not running (status: $status)"
                failed=$((failed + 1))
              fi
            else
              echo "✗ Container ${container} is not found"
              failed=$((failed + 1))
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "✗ Health check failed: $failed container(s) are not healthy"
            docker compose -f docker-compose.yml logs
            exit 1
          fi
          echo "✓ All containers are healthy"

      - name: Deployment summary
        if: success()
        run: |
          echo "=========================================="
          echo "✓ Deployment to staging completed successfully!"
          echo "=========================================="
          echo "Services are running at:"
          echo "  - Frontend: http://localhost"
          echo "  - Admin Panel: http://localhost/admin"
          echo "  - Health Check: http://localhost/health"
          echo "=========================================="

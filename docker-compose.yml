version: '3.3'

services:
  # PostgreSQL Database
  # Internal only - not exposed to internet
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: liceum
    # No ports exposed - only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school-network

  # Admin Panel (Next.js)
  # Internal only - accessible through nginx at /admin
  admin-panel:
    build:
      context: ./admin_panel
      dockerfile: Dockerfile
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        JWT_SECRET: ${JWT_SECRET}
        DATABASE_URL: ${DATABASE_URL}
    container_name: admin-panel
    # No ports exposed - only accessible through nginx
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
    pids_limit: 300
    resources:
      cpus: "1.5"
      memory: 3G
    depends_on:
      - postgres_db
    volumes:
      - admin-uploads:/app/public/uploads
      - admin-db:/app/prisma
    networks:
      - school-network
    restart: unless-stopped

  # Frontend (Next.js)
  # Internal only - accessible through nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    # No ports exposed - only accessible through nginx
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PORT=3000
    depends_on:
      - admin-panel
    networks:
      - school-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  # Only service exposed to internet - routes traffic to frontend and admin-panel
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - admin-uploads:/usr/share/nginx/html/uploads:ro
      - ../certs/origin_cert.pem:/etc/ssl/cloudflare/origin.pem
      - ../certs/origin_cert_private_key.pem:/etc/ssl/cloudflare/origin.key
    depends_on:
      - frontend
      - admin-panel
    networks:
      - school-network

volumes:
  admin-uploads:
    driver: local
  admin-db:
    driver: local
  postgres_data:
    driver: local

networks:
  school-network:
    driver: bridge
